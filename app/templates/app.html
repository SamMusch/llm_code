{% extends "base.html" %}
{% block content %}
<div class="app-shell flex h-full w-full overflow-hidden">
  <!-- Mobile top bar (hamburger) -->
  <div class="md:hidden fixed top-0 left-0 right-0 z-20 flex items-center gap-2 border-b px-3 py-3 backdrop-blur" style="background: var(--bg-panel); border-color: var(--border);">
    <button id="sidebarToggle" type="button" class="inline-flex h-10 w-10 items-center justify-center rounded-2xl border" style="background: var(--bg-panel); border-color: var(--border); color: var(--text-main);" aria-label="Open sidebar">
      <span class="block h-[2px] w-5" style="background: var(--text-main);"></span>
      <span class="mt-1 block h-[2px] w-5" style="background: var(--text-main);"></span>
      <span class="mt-1 block h-[2px] w-5" style="background: var(--text-main);"></span>
    </button>
    <div class="min-w-0 flex-1">
      <div class="truncate text-sm font-semibold" id="mobileTitle" style="color: var(--text-main);"></div>
    </div>
    <button id="rightbarToggle" type="button" class="inline-flex h-10 w-10 items-center justify-center rounded-2xl border" style="background: var(--bg-panel); border-color: var(--border); color: var(--text-main);" aria-label="Open tools panel">
      <span class="block h-[2px] w-5" style="background: var(--text-main);"></span>
      <span class="mt-1 block h-[2px] w-5" style="background: var(--text-main);"></span>
      <span class="mt-1 block h-[2px] w-5" style="background: var(--text-main);"></span>
    </button>
  </div>

  <!-- Sidebar -->
  <aside id="sidebar" class="fixed inset-y-0 left-0 z-30 hidden w-[22vw] min-w-[280px] max-w-[360px] flex-col border-r md:static md:flex" style="background: var(--bg-sidebar); border-color: var(--border);" aria-label="Sidebar">
    <!-- Sidebar header -->
    <div class="flex items-center justify-between border-b px-4 py-4" style="border-color: var(--border);">
      <div class="h-10" aria-hidden="true"></div>
      <button id="sidebarClose" type="button" class="md:hidden inline-flex h-10 w-10 items-center justify-center rounded-2xl border" style="background: var(--bg-panel); border-color: var(--border); color: var(--text-main);" aria-label="Close sidebar">×</button>
    </div>

    <!-- Section 1: Controls -->
    <div class="px-4 py-4 border-b" style="border-color: var(--border);">
      <button id="newChatBtn" class="w-full inline-flex items-center justify-center btn-primary px-4 py-3 text-sm font-medium focus:outline-none">
        New chat
      </button>
      <div class="mt-3">
        <input id="chatSearch" type="search" class="w-full px-3 py-2.5 text-sm focus:outline-none" placeholder="Search chats" />
      </div>
    </div>

    <!-- Section 2: Projects -->
    <div class="px-4 py-4 border-b" style="border-color: var(--border);">
      <div class="flex items-center justify-between">
        <div class="text-[11px] font-semibold uppercase tracking-[0.14em]" style="color: var(--text-muted);">Projects</div>
        <button id="newProjectBtn" type="button" class="rounded-2xl border px-3 py-1.5 text-xs font-medium" style="background: var(--bg-panel); border-color: var(--border); color: var(--text-main);">New</button>
      </div>
      <div id="projectList" class="mt-3 space-y-1" aria-label="Projects"></div>
    </div>

    <!-- Section 3: Conversations -->
    <div class="flex-1 overflow-hidden">
      <div class="px-4 pt-4 pb-2 text-[11px] font-semibold uppercase tracking-[0.14em]" style="color: var(--text-muted);">Conversations</div>
      <div class="h-full overflow-y-auto px-2 pb-4">
        <div id="chatList" class="space-y-1" aria-label="Chats"></div>
      </div>
    </div>

    <!-- Section 4: Settings -->
    <div class="mt-auto border-t p-3" style="border-color: var(--border);">
      <button id="settingsModalBtn" type="button" class="w-full inline-flex items-center justify-center rounded-2xl border px-3 py-3 text-sm font-medium" style="background: var(--bg-panel); border-color: var(--border); color: var(--text-main);">
        Settings
      </button>
      <a class="mt-2 w-full inline-flex items-center justify-center rounded-2xl border px-4 py-3 text-sm font-medium" style="background: var(--bg-panel); border-color: var(--border); color: var(--text-main);" href="/app/logout">Logout</a>
    </div>
  </aside>

  <!-- Mobile sidebar backdrop -->
  <div id="sidebarBackdrop" class="fixed inset-0 z-20 hidden bg-black/30 md:hidden" aria-hidden="true"></div>
  <div id="rightbarBackdrop" class="fixed inset-0 z-20 hidden bg-black/30 md:hidden" aria-hidden="true"></div>

  <!-- Main -->
  <main class="flex min-w-0 flex-1 flex-col pt-12 md:pt-0" style="background: var(--bg-page);" aria-label="Chat">
    <!-- Header -->
    <header class="sticky top-0 z-10 border-b backdrop-blur" style="background: color-mix(in srgb, var(--bg-panel) 88%, transparent); border-color: var(--border);">
      <div class="flex items-center justify-between px-4 py-4">
        <div class="flex items-center gap-3">
          <button id="sidebarToggleDesktop" type="button" class="hidden md:inline-flex h-10 w-10 items-center justify-center rounded-2xl border" style="background: var(--bg-panel); border-color: var(--border); color: var(--text-main);" aria-label="Toggle sidebar">☰</button>
          <div class="text-base font-semibold" style="color: var(--text-main);"></div>
        </div>
        <div class="flex items-center gap-2">
          <button id="rightbarToggleDesktop" type="button" class="hidden md:inline-flex h-10 w-10 items-center justify-center rounded-2xl border" style="background: var(--bg-panel); border-color: var(--border); color: var(--text-main);" aria-label="Toggle tools panel">☰</button>
        </div>
      </div>
    </header>

    <!-- Thread -->
    <section class="flex-1 overflow-y-auto px-3 py-3 md:px-5 md:py-3" aria-label="Messages">
      <div id="chatMessages" class="mx-auto w-full max-w-4xl px-4 py-3 space-y-4"></div>
    </section>

    <!-- Composer -->
    <footer class="border-t" style="background: var(--bg-panel); border-color: var(--border);">
      <div class="mx-auto w-full max-w-4xl px-4 py-4">
        <div id="attachmentStrip" class="mb-3 hidden flex flex-wrap gap-2" aria-label="Attachments"></div>

        <div class="flex items-end gap-2 rounded-[2rem] border p-2" style="background: var(--bg-panel); border-color: var(--border); box-shadow: var(--shadow-sm);">
          <button
            id="attachBtn"
            type="button"
            class="inline-flex h-[44px] w-[44px] items-center justify-center rounded-2xl border text-lg leading-none focus:outline-none"
            style="background: var(--bg-panel); border-color: var(--border); color: var(--text-main);"
            aria-label="Attach files"
            title="Attach files"
          >
            +
          </button>
          <input
            id="fileInput"
            type="file"
            class="hidden"
            multiple
            aria-hidden="true"
          />

          <textarea
            id="chatInput"
            class="min-h-[44px] w-full resize-none border-0 bg-transparent px-3 py-2.5 text-sm focus:outline-none focus:ring-0"
            style="color: var(--text-main);"
            rows="1"
            placeholder="Message..."
            aria-label="Message"
          ></textarea>
          <button id="sendBtn" class="inline-flex h-[44px] items-center justify-center btn-primary px-5 text-sm font-medium focus:outline-none">
            Send
          </button>
        </div>
        <div class="mt-2 text-xs" style="color: var(--text-muted);"></div>
      </div>
    </footer>
  </main>

  <!-- Right sidebar (Tools) -->
  <aside id="rightbar" class="fixed inset-y-0 right-0 z-30 hidden w-[22vw] min-w-[280px] max-w-[360px] flex-col border-l md:static md:flex" style="background: var(--bg-sidebar); border-color: var(--border);" aria-label="Tools panel" data-collapsed="false">
    <!-- Right sidebar header -->
    <div id="rightbarHeader" class="flex items-center justify-end px-4 py-4">
      <button id="rightbarClose" type="button" class="md:hidden inline-flex h-10 w-10 items-center justify-center rounded-2xl border" style="background: var(--bg-panel); border-color: var(--border); color: var(--text-main);" aria-label="Close tools panel">×</button>
    </div>

    <!-- Section 1: Tools -->
    <div class="px-4 py-4 border-b" style="border-color: var(--border);">
      <div class="text-[11px] font-semibold uppercase tracking-[0.14em]" style="color: var(--text-muted);">Tools</div>
      <div class="mt-3 space-y-2">
        <label class="flex items-center gap-2 text-sm">
          <input id="toolDb" type="checkbox" class="h-4 w-4 rounded border-slate-300" />
          <span>Database</span>
        </label>
        <label class="flex items-center gap-2 text-sm">
          <input id="toolPlaceholder1" type="checkbox" class="h-4 w-4 rounded border-slate-300" />
          <span>Placeholder</span>
        </label>
      </div>
      <div class="mt-3 text-xs" style="color: var(--text-muted);">Selecting Database enables Postgres-backed tools.</div>
    </div>

    <!-- Section 3: Metadata filters -->
    <div class="px-4 py-4 border-b" style="border-color: var(--border);">
      <div class="text-[11px] font-semibold uppercase tracking-[0.14em]" style="color: var(--text-muted);">Metadata</div>

      <div class="mt-3 space-y-3">
        <div>
          <label for="metaTitle" class="block text-xs font-medium" style="color: var(--text-muted);">Title contains</label>
          <input id="metaTitle" type="text" class="mt-1 w-full px-3 py-2 text-sm focus:outline-none" placeholder="eg planning" style="color: var(--text-main);" />
        </div>

        <div>
          <label for="metaTags" class="mt-4 block text-xs font-medium" style="color: var(--text-muted);">Tags (comma-separated)</label>
          <input id="metaTags" type="text" class="mt-1 w-full px-3 py-2 text-sm focus:outline-none" placeholder="eg client, strategy" style="color: var(--text-main);" />
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label for="metaCreatedFrom" class="mt-4 block text-xs font-medium" style="color: var(--text-muted);">Created from</label>
            <input id="metaCreatedFrom" type="date" class="mt-1 w-full px-3 py-2 text-sm focus:outline-none" />
          </div>
          <div>
            <label for="metaCreatedTo" class="mt-4 block text-xs font-medium" style="color: var(--text-muted);">Created to</label>
            <input id="metaCreatedTo" type="date" class="mt-1 w-full px-3 py-2 text-sm focus:outline-none" />
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label for="metaModifiedFrom" class="mt-4 block text-xs font-medium" style="color: var(--text-muted);">Modified from</label>
            <input id="metaModifiedFrom" type="date" class="mt-1 w-full px-3 py-2 text-sm focus:outline-none" />
          </div>
          <div>
            <label for="metaModifiedTo" class="mt-4 block text-xs font-medium" style="color: var(--text-muted);">Modified to</label>
            <input id="metaModifiedTo" type="date" class="mt-1 w-full px-3 py-2 text-sm focus:outline-none" />
          </div>
        </div>
      </div>
    </div>
  </aside>
</div>

<!-- Settings modal (HTML scaffold; behavior wired in app.js) -->
<div id="settingsModal" class="fixed inset-0 z-40 hidden" aria-hidden="true">
  <div class="absolute inset-0 bg-black/30" data-close="settings"></div>
  <div
    id="settingsDialog"
    class="absolute w-[92vw] max-w-2xl rounded-[2rem] border"
    style="background: var(--bg-panel); border-color: var(--border); color: var(--text-main); box-shadow: var(--shadow-md);"
  >
    <div
      id="settingsDialogHeader"
      class="flex items-center justify-between border-b px-4 py-4 cursor-move select-none"
      style="border-color: var(--border);"
    >
      <div class="text-sm font-semibold" style="color: var(--text-main);">Settings</div>
      <button
        type="button"
        class="inline-flex h-10 w-10 items-center justify-center rounded-2xl border"
        style="background: var(--bg-panel); border-color: var(--border); color: var(--text-main);"
        data-close="settings"
        aria-label="Close"
      >×</button>
    </div>

    <div class="max-h-[70vh] overflow-y-auto p-5 space-y-6" style="color: var(--text-main);">
      <!-- Sub-section 1: Models -->
      <div>
        <div class="text-xs font-semibold uppercase tracking-[0.16em]" style="color: var(--text-muted);">Models</div>
        <select id="modelSelect" class="mt-2 w-full px-3 py-2 text-sm">
          <option value="default">Default</option>
        </select>
      </div>

      <!-- Sub-section 2: Preferences -->
      <div>
        <div class="flex items-center justify-between gap-3">
          <div class="text-xs font-semibold uppercase tracking-[0.16em]" style="color: var(--text-muted);">Preferences</div>
          <button id="restoreDefaultsBtn" type="button" class="inline-flex items-center justify-center rounded-2xl border px-3 py-1.5 text-sm italic" style="background: var(--bg-panel); border-color: var(--border); color: color-mix(in srgb, var(--text-main) 70%, transparent);">Restore to defaults</button>
        </div>
        <div class="mt-3 grid grid-cols-1 gap-3">
          <div class="flex items-center justify-between gap-3">
            <div class="text-sm">Accent</div>
            <div class="flex items-center gap-2">
              <input id="accentHex" type="text" value="#bfbfbf" class="w-28 px-3 py-2 text-sm focus:outline-none" placeholder="#000000" inputmode="text" autocomplete="off" spellcheck="false" />
              <input id="accentPicker" type="color" value="#bfbfbf" />
            </div>
          </div>
          <div class="flex items-center justify-between gap-3">
            <div class="text-sm">Toggle background</div>
            <div class="flex items-center gap-2">
              <input id="toggleBgHex" type="text" value="#ECECEC" class="w-28 px-3 py-2 text-sm focus:outline-none" placeholder="#000000" inputmode="text" autocomplete="off" spellcheck="false" />
              <input id="toggleBgPicker" type="color" value="#ECECEC" />
            </div>
          </div>
          <div class="flex items-center justify-between gap-3">
            <div class="text-sm">Chat background</div>
            <div class="flex items-center gap-2">
              <input id="chatBgHex" type="text" value="#ffffff" class="w-28 px-3 py-2 text-sm focus:outline-none" placeholder="#000000" inputmode="text" autocomplete="off" spellcheck="false" />
              <input id="chatBgPicker" type="color" value="#ffffff" />
            </div>
          </div>
        </div>
      </div>

      <!-- Sub-section 3: Tasks -->
      <div>
        <div class="text-xs font-semibold uppercase tracking-[0.16em]" style="color: var(--text-muted);">Tasks</div>
        <button id="scheduleTaskBtn" type="button" class="mt-2 inline-flex items-center justify-center rounded-2xl border px-3 py-2 text-sm" style="background: var(--bg-panel); border-color: var(--border); color: var(--text-main);">Schedule a task</button>
        <div id="taskList" class="mt-3 space-y-2"></div>
      </div>
    </div>
  </div>
</div>


<script src="/app/static/app.js"></script>
{% endblock %}
